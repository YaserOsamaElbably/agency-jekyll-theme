- name: "أتمتة التقارير"
  description: "إنشاء سكربتات وتقارير مؤتمتة لتقليل التكرار وزيادة الكفاءة."

- name: "استشارات مؤشرات الأداء"
  description: "تحليل KPIs ومساعدة الشركات في تحسين الأداء وتحقيق الأهداف."
